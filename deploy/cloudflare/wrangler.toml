name = "mediacms-video-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"
workers_dev = true  # 保留 .workers.dev 地址方便调试，部署稳定后可改为 false

# 绑定自定义域名路由：cdn.5xxxxx.cc/media/* → 此 Worker
routes = [
  { pattern = "cdn.5xxxxx.cc/media/*", zone_name = "5xxxxx.cc" }
]

[vars]
# 非敏感的默认值，可在此直接写
B2_REGION = "us-west-004"
B2_ENDPOINT = "s3.us-west-004.backblazeb2.com"

# ── 敏感 Secrets 通过命令行设置（不要写在此文件里）──────────────────────────
# 首次部署后执行以下命令，按提示粘贴对应值：
#
#   wrangler secret put JWT_SECRET     # 与 Django .env 里的 SECRET_KEY 相同
#   wrangler secret put B2_KEY_ID      # B2 Application Key ID
#   wrangler secret put B2_APP_KEY     # B2 Application Key
#   wrangler secret put B2_BUCKET_NAME # B2 桶名
#
# ── 本地开发（wrangler dev 会自动读取此文件）────────────────────────────────
# 在 deploy/cloudflare/ 目录下创建 .dev.vars（已加入 .gitignore），内容：
#
#   JWT_SECRET=<与 Django SECRET_KEY 相同的值>
#   B2_KEY_ID=0040c4e66d52e910000000004
#   B2_APP_KEY=<你的 B2 App Key>
#   B2_BUCKET_NAME=for5xcc
#   B2_ENDPOINT=s3.us-west-004.backblazeb2.com
#   B2_REGION=us-west-004
